name: Testar fontes
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Testes específicos (feed:URL ou links:URL|trecho), separados por espaço"
        required: false
        default: ""
jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente/requirements.txt
      - run: pip install -r requirements.txt
      - run: python sondar_fontes.py ${{ inputs.args }}
